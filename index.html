<style>
  :root {
    color-scheme: dark;
    --bg: #0c0c0d;
    --card: #161618;
    --line: #232327;
    --line2: #2f2f34;
    --track: #26262a;
    --text: #f4f4f2;
    --text2: #d6d6d2;
    --muted: #9a9aa1;
    --dim: #6c6c73;
    --accent: #c8f169;
    --ink: #0c0c0d;
    --warn: #ffc247;
    --bad: #ff6b5e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  /* Marco de app: solo se desplaza el contenido; la barra de pestañas forma parte del marco y no se mueve. */
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.35 'Space Grotesk', -apple-system, system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
    display: flex;
    flex-direction: column;
    /* Anclado a los bordes y no con 100dvh: el iPhone, a pantalla completa, resta la barra de estado a esa altura. */
    position: fixed;
    inset: 0;
    overflow: hidden;
    overscroll-behavior: none;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
  main { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px 24px; }

  /* Cabecera */
  .cab { display: flex; align-items: center; gap: 8px; padding: 4px 4px 14px; }
  .cab h1 { flex: 1; margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .cab h1::first-letter { text-transform: uppercase; }
  .cab h1 small { font-size: 15px; color: var(--muted); font-weight: 500; margin-left: 6px; }
  .redondo {
    width: 44px; height: 44px; flex: 0 0 44px; border-radius: 14px; border: 1px solid var(--line2);
    background: var(--card); display: flex; align-items: center; justify-content: center;
  }
  .redondo:disabled { color: var(--dim); }
  .mesnav { display: flex; gap: 6px; }

  /* Mosaico */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .span2 { grid-column: span 2; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; min-width: 0; }
  .tile .et { font-size: 12px; color: var(--muted); font-weight: 500; }
  .tile .val { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .sub { font-size: 12px; color: var(--muted); }
  .cabtile { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }

  .hero { background: var(--accent); color: var(--ink); border-radius: 26px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .hero .et { font-size: 14px; font-weight: 600; }
  .hero .big { font-size: 50px; font-weight: 700; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .pildora { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .hero .pildora { background: var(--ink); color: var(--accent); }
  .barras { display: flex; align-items: flex-end; gap: 2px; height: 56px; }
  .barras button { flex: 1; height: 100%; padding: 0; border: 0; background: none; display: flex; align-items: flex-end; min-width: 0; }
  .barras i { display: block; width: 100%; border-radius: 3px 3px 1px 1px; background: var(--ink); }
  .barras .futuro i { background: rgba(12,12,13,.15); }
  .eje { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; opacity: .7; }

  .prog { height: 6px; border-radius: 3px; background: var(--track); position: relative; overflow: hidden; margin: 8px 0 6px; }
  .prog i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--accent); min-width: 2px; }

  /* Formularios */
  .seg { display: flex; background: var(--bg); border: 1px solid var(--line2); border-radius: 14px; padding: 3px; gap: 3px; }
  .seg label { flex: 1; position: relative; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: block; text-align: center; padding: 8px 6px; border-radius: 11px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg input:checked + span { background: var(--text); color: var(--ink); }
  .importe { display: flex; gap: 8px; flex: 1; min-width: 0; }
  .importe label { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 4px; background: var(--bg); border: 1px solid var(--line2); border-radius: 16px; padding: 8px 14px; }
  .importe input { flex: 1; min-width: 0; border: 0; background: none; font-size: 26px; font-weight: 700; outline: none; }
  .importe span { color: var(--dim); font-size: 18px; }
  .mas { width: 60px; flex: 0 0 60px; border: 0; border-radius: 16px; background: var(--accent); color: var(--ink); display: flex; align-items: center; justify-content: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips label { position: relative; }
  .chips input { position: absolute; opacity: 0; pointer-events: none; }
  .chips span {
    display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 12px;
    border: 1px solid var(--line2); color: var(--text2); font-size: 13px; font-weight: 600;
  }
  .chips input:checked + span { background: var(--text); border-color: var(--text); color: var(--ink); }
  .chips input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .campo { width: 100%; min-width: 0; border: 1px solid var(--line2); background: var(--bg); border-radius: 12px; padding: 10px 12px; outline: none; }
  .campo:focus { border-color: var(--muted); }
  .fila { display: flex; gap: 8px; align-items: center; }
  .fila > input[type="date"] { flex: 0 0 148px; }
  .pila { display: flex; flex-direction: column; gap: 12px; }
  .boton { height: 50px; border: 0; border-radius: 16px; background: var(--accent); color: var(--ink); font-weight: 700; padding: 0 18px; }
  .boton.sec { background: none; border: 1px solid var(--line2); color: var(--text); }
  .boton.peq { height: 40px; border-radius: 12px; font-size: 14px; padding: 0 14px; }
  .boton:disabled { opacity: .5; }
  .etq { font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: -4px; }

  /* Listas */
  .lista .item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .lista .item:first-child { border-top: 0; }
  .punto { width: 10px; height: 10px; flex: 0 0 10px; border-radius: 5px; display: inline-block; }
  .que { flex: 1; min-width: 0; }
  .que b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .que small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cifra { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pos { color: var(--accent); }
  .neg { color: var(--bad); }
  .x {
    width: 34px; height: 34px; flex: 0 0 34px; border: 0; border-radius: 10px; background: none; color: var(--dim);
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
  }
  .x.seguro { width: auto; flex: 0 0 auto; padding: 0 10px; background: var(--bad); color: var(--ink); }
  .dia { font-size: 12px; color: var(--muted); font-weight: 600; margin: 16px 0 2px; }
  .dia::first-letter { text-transform: uppercase; }
  .vacio { color: var(--muted); font-size: 14px; padding: 6px 0; }
  .nota { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .enlace { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 14px; padding: 8px 0; }

  /* Ticket y reparto */
  .que.toque { background: none; border: 0; padding: 0; text-align: left; }
  .marca { color: var(--dim); display: flex; flex: 0 0 auto; }
  .fotoBtn {
    position: relative; flex: 0 0 auto; display: flex; align-items: center; gap: 7px; height: 40px; padding: 0 12px;
    border: 1px solid var(--line2); border-radius: 12px; font-size: 14px; font-weight: 600; overflow: hidden; cursor: pointer;
  }
  .fotoBtn input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .fotoBtn img { width: 24px; height: 24px; border-radius: 6px; object-fit: cover; display: block; }
  .fotoBtn.puesta { border-color: var(--accent); color: var(--accent); }
  .segQuien span { white-space: nowrap; padding-left: 4px; padding-right: 4px; }
  .resumenRep { background: var(--bg); border: 1px solid var(--line2); border-radius: 14px; padding: 10px 12px; font-size: 13px; line-height: 1.6; }
  .parteFila { display: flex; align-items: center; gap: 8px; }
  .parteFila span { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .parteFila input { flex: 0 0 104px; width: 104px; text-align: right; }
  .galeria { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .galeria button { padding: 0; min-width: 0; text-align: left; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .galeria .foto { display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; background: var(--track); color: var(--dim); }
  .galeria .pie { display: block; padding: 6px 8px 8px; }
  .galeria .pie b, .galeria .pie small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .galeria .pie b { font-size: 13px; font-variant-numeric: tabular-nums; }
  .galeria .pie small { font-size: 11px; color: var(--muted); }
  .fotoGrande { min-height: 80px; }
  .fotoGrande img { display: block; width: 100%; border-radius: 14px; }

  /* Más */
  .menu { display: flex; flex-direction: column; gap: 8px; }
  .menu button {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  }
  .menu .ico { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 12px; background: var(--track); display: flex; align-items: center; justify-content: center; color: var(--accent); }
  .menu .flecha { color: var(--dim); font-size: 22px; }

  /* Estadísticas */
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal .ds { font-size: 11px; color: var(--dim); text-align: center; padding-bottom: 2px; }
  .cal button { aspect-ratio: 1; border: 0; border-radius: 8px; font-size: 11px; font-weight: 600; padding: 0; display: flex; align-items: center; justify-content: center; }
  .barrasv { display: flex; align-items: flex-end; gap: 8px; height: 124px; }
  .barrasv .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; min-width: 0; }
  .barrasv .col i { display: block; width: 100%; border-radius: 4px 4px 1px 1px; background: var(--accent); }
  .barrasv .col.tenue i { background: var(--line2); }
  .barrasv .col span { font-size: 11px; color: var(--muted); }
  .barrasv .col em { font-size: 10px; color: var(--text2); font-style: normal; white-space: nowrap; }
  .ley { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
  .ley i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

  /* Pestañas */
  .tabs {
    flex: 0 0 auto; z-index: 10; background: var(--bg);
    border-top: 1px solid var(--line); padding: 2px 8px max(4px, calc(env(safe-area-inset-bottom) - 14px));
  }
  .tabs div { max-width: 560px; margin: 0 auto; display: flex; }
  .tabs button {
    flex: 1; border: 0; background: none; color: var(--dim); display: flex; flex-direction: column; align-items: center;
    gap: 2px; padding: 5px 0 3px; font-size: 10px; font-weight: 600; min-height: 46px;
  }
  .tabs button[aria-current="page"] { color: var(--accent); }

  /* Hoja inferior */
  .velo { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
  .modal {
    width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; background: var(--card); border: 1px solid var(--line2);
    border-radius: 26px 26px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .modal .cabtile h2 { margin: 0; font-size: 20px; }

  .aviso {
    position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 30;
    max-width: 528px; margin: 0 auto; background: var(--text); color: var(--ink); padding: 12px 16px; border-radius: 14px;
    font-size: 14px; font-weight: 600; opacity: 0; transform: translateY(10px); transition: .2s; pointer-events: none;
  }
  .aviso.ver { opacity: 1; transform: none; }
  .carga { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); width: 0; z-index: 40; transition: width .4s; }
  .carga.ver { width: 70%; }
  .cargando { color: var(--muted); padding: 60px 0; text-align: center; }

  /* Pantalla de carga */
  .splash {
    position: fixed; inset: 0; z-index: 50; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    transition: opacity .45s ease;
  }
  .splash.fuera { opacity: 0; pointer-events: none; }
  .splash .logo {
    width: 104px; height: 104px; border-radius: 26px; background: var(--accent); color: var(--ink);
    display: flex; align-items: center; justify-content: center; font-size: 66px; font-weight: 700; line-height: 1;
    animation: latido 2.4s ease-in-out infinite; transition: transform .45s ease;
  }
  .splash.fuera .logo { transform: scale(1.15); }
  .splash .nombre { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
  .splash .eq { display: flex; align-items: flex-end; gap: 6px; height: 34px; margin-top: 6px; }
  .splash .eq i { width: 10px; border-radius: 3px; background: var(--accent); animation: barra 1.1s ease-in-out infinite; }
  .splash .eq i:nth-child(1) { animation-delay: -.9s; }
  .splash .eq i:nth-child(2) { animation-delay: -.6s; }
  .splash .eq i:nth-child(3) { animation-delay: -.3s; }
  .splash .eq i:nth-child(4) { animation-delay: 0s; }
  .splash .frase { font-size: 14px; color: var(--muted); height: 20px; transition: opacity .25s; }
  @keyframes barra { 0%, 100% { height: 8px; } 50% { height: 34px; } }
  @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @media (prefers-reduced-motion: reduce) {
    .splash .logo, .splash .eq i { animation: none; }
    .splash .eq i { height: 20px; }
  }
</style>
</head>

  let alGuardar = null;
  try { vista = localStorage.getItem('gastos.vista') || 'inicio'; } catch (e) {}
  if (!TABS.some(t => t[0] === vista) && !SUB[vista]) vista = 'inicio';

  // ---------- Servidor ----------

  function leerApi() {
    const q = new URLSearchParams(location.search).get('api');
    let id = q && /^[\w-]{20,}$/.test(q) ? q : '';
    if (id) {
      try { localStorage.setItem('gastos.api', id); } catch (e) {}
    } else {
      try { id = localStorage.getItem('gastos.api') || ''; } catch (e) {}
    }
    return 'https://script.google.com/macros/s/' + (id || 'AKfycbxyNohrZ8It8cPh2XLZ9dTTq7b6SmfoVIYS073xTVMbgW-jPLy_63Un6jDv-E2A0ikD') + '/exec';
  }

  // Dentro de Google la clave llega en la página; en la web propia, por ?k= la primera vez y luego se recuerda.
  function leerClave() {
    const dk = document.body.dataset.k;
    if (dk && !dk.startsWith('<?')) return dk;
    const q = new URLSearchParams(location.search).get('k');
    if (q) {
      try { localStorage.setItem('gastos.k', q); } catch (e) {}
      return q;
    }
    try { return localStorage.getItem('gastos.k') || ''; } catch (e) { return ''; }
  }

  function run(fn, ...args) {
    if (EN_GOOGLE) {
      return new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](K, ...args));
    }
    return llamarApi(fn, args);
  }

  // text/plain evita la comprobación previa del navegador, que el servidor de Google no contesta.
  async function llamarApi(fn, args) {
    const r = fn === 'datos'
      ? await fetch(API + '?accion=datos&k=' + encodeURIComponent(K) + (args[0] ? '&mes=' + args[0] : ''))
      : fn === 'ticket'
      ? await fetch(API + '?accion=ticket&k=' + encodeURIComponent(K) + '&id=' + encodeURIComponent(args[0]))
      : await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ api: fn, k: K, que: args[0], d: args[1], mes: args[2] }),
        });
    let j;
    try { j = await r.json(); } catch (e) { throw new Error('El servidor no ha contestado bien, prueba otra vez'); }
    if (j && j.error) throw new Error(j.error);
    return j;
  }

  function pantallaClave(error) {
    $('mesnav').hidden = true;
    $('titulo').textContent = 'Lima';
    $('vista').innerHTML = `<form class="tile pila" id="formClave" autocomplete="off">
        <div class="et">${error ? esc(error) + '. ' : ''}Escribe tu clave para entrar (solo la primera vez).</div>
        <input class="campo" name="clave" placeholder="Clave" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="boton">Entrar</button>
      </form>`;
    $('formClave').onsubmit = e => {
      e.preventDefault();
      const c = new FormData(e.target).get('clave').trim();
      if (c) location.href = location.pathname + '?k=' + encodeURIComponent(c);
    };
  }

  function cargando(si) { $('carga').classList.toggle('ver', si); }

  async function cargar(m) {
    cargando(true);
    try {
      D = await run('datos', m || null);
      mes = D.mes;
      const rapido = $('rapido');
      if (m || !(rapido && rapido.dataset.sucio)) pintar();
      if (!m) guardarCache(D);
    } catch (e) {
      if (/clave/i.test(e.message) && !EN_GOOGLE) pantallaClave(e.message);
      else avisar('Error: ' + e.message);
    }
    cargando(false);
    quitarSplash();
  }

  // Los últimos datos del mes actual se guardan en el móvil para abrir al instante; luego se refrescan.
  function guardarCache(d) {
    try { localStorage.setItem('gastos.cache', JSON.stringify(d)); } catch (e) {}
  }
  function leerCache() {
    try { return JSON.parse(localStorage.getItem('gastos.cache') || 'null'); } catch (e) { return null; }
  }

  // ---------- Pantalla de carga ----------

  const SPLASH_DESDE = Date.now();
  const FRASES = ['Contando monedas…', 'Sumando tickets…', 'Mirando tus huchas…', 'Repasando presupuestos…', 'Casi está…'];
  let nFrase = 0;
  const cambiarFrase = setInterval(() => {
    const f = $('frase');
    if (!f) return clearInterval(cambiarFrase);
    f.style.opacity = 0;
    setTimeout(() => { nFrase = (nFrase + 1) % FRASES.length; f.textContent = FRASES[nFrase]; f.style.opacity = 1; }, 250);
  }, 1400);

  // Se ve al menos un momento, aunque los datos lleguen enseguida.
  function quitarSplash() {
    const s = $('splash');
    if (!s || s.classList.contains('fuera')) return;
    setTimeout(() => {
      s.classList.add('fuera');
      clearInterval(cambiarFrase);
      setTimeout(() => s.remove(), 500);
    }, Math.max(0, 1100 - (Date.now() - SPLASH_DESDE)));
  }

  async function hacer(que, d) {
    cargando(true);
    try {
      const r = await run('accion', que, d, mes);
      D = r.datos;
      mes = D.mes;
      pintar();
      if (r.msg) avisar(r.msg);
      return true;
    } catch (e) {
      avisar('Error: ' + e.message);
      return false;
    } finally {
      cargando(false);
    }
  }

  // ---------- Utilidades ----------

  function avisar(texto) {
    const a = $('aviso');
    a.textContent = texto;
    a.classList.add('ver');
    clearTimeout(avisar.t);
    avisar.t = setTimeout(() => a.classList.remove('ver'), 3800);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const nombreMes = m => MESES[Number(m.slice(5)) - 1];
  const mesCorto = m => MES_CORTO[Number(m.slice(5)) - 1];
  function moverMes(m, n) {
    const [y, mm] = m.split('-').map(Number);
    const t = y * 12 + mm - 1 + n;
    return Math.floor(t / 12) + '-' + String(t % 12 + 1).padStart(2, '0');
  }
  const fechaLarga = dia => new Date(dia + 'T12:00:00').toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  const fechaCorta = dia => Number(dia.slice(8)) + ' ' + MES_CORTO[Number(dia.slice(5, 7)) - 1];
  function hoyISO() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // El color de un tema sale de su posición en la lista, así no cambia al filtrar.
  function colorTema(tema, tipo = 'gasto') {
    if (tipo === 'ingreso') return 'var(--accent)';
    const i = D.temas.filter(t => t.tipo === 'gasto').findIndex(t => t.tema === tema);
    return i < 0 ? 'var(--dim)' : PALETA[i % PALETA.length];
  }

  const borrar = (act, attrs) => `<button type="button" class="x" data-act="${act}" data-peligro ${attrs} aria-label="Borrar">✕</button>`;
  const vacio = t => `<div class="vacio">${t}</div>`;

  // ---------- Pintar ----------

  function pintar() {
    // La web es la misma para todos: los servidores sin actualizar no tienen tickets.
    if (vista === 'tickets' && !D.conTickets) vista = 'mas';
    const esSub = !!SUB[vista];
    const conMes = ['inicio', 'movs', 'stats', 'tickets'].includes(vista);
    $('atras').hidden = !esSub;
    $('mesnav').hidden = !conMes;
    $('despues').disabled = mes >= D.hoy;
    const anio = mes.slice(0, 4) !== D.hoy.slice(0, 4) ? ' ' + mes.slice(0, 4) : '';
    if (vista === 'inicio') $('titulo').innerHTML = esc(nombreMes(mes)) + (anio ? `<small>${anio}</small>` : '');
    else if (conMes) $('titulo').innerHTML = esc(SUB[vista] || 'Movimientos') + `<small>${esc(mesCorto(mes) + anio)}</small>`;
    else $('titulo').textContent = SUB[vista] || TABS.find(t => t[0] === vista)[1];

    // La barra se dibuja una sola vez; al cambiar de pestaña solo cambia cuál está encendida.
    const tabActiva = esSub ? 'mas' : vista;
    if (!$('tabs').children.length) {
      $('tabs').innerHTML = TABS.map(([id, txt]) => `<button type="button" data-tab="${id}">${ico(id, 22)}<span>${txt}</span></button>`).join('');
    }
    $('tabs').querySelectorAll('[data-tab]').forEach(b => {
      if (b.dataset.tab === tabActiva) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });

    $('vista').innerHTML = VISTAS[vista]();
    if (vista === 'inicio') prepararFormMov($('rapido'));
  }

  function chip(name, value, texto, marcado, color) {
    return `<label><input type="radio" name="${name}" value="${esc(value)}" ${marcado ? 'checked' : ''}><span>${color ? `<i class="punto" style="background:${color}"></i>` : ''}${esc(texto)}</span></label>`;
  }

  // Formulario de movimiento: lo usan la tarjeta rápida de Inicio y la hoja de Movimientos.
  function formMov(conBoton) {
    const proy = D.proyectos.length
      ? `<div class="etq">Proyecto</div><div class="chips">${chip('proyecto', '', 'Ninguno', true)}${D.proyectos.map(p => chip('proyecto', p.nombre, p.nombre)).join('')}</div>`
      : '';
    return `
      <div class="seg" role="radiogroup" aria-label="Tipo">
        <label><input type="radio" name="tipo" value="gasto" checked><span>Gasto</span></label>
        <label><input type="radio" name="tipo" value="ingreso"><span>Ingreso</span></label>
      </div>
      <div class="importe">
        <label><input name="importe" inputmode="decimal" placeholder="0,00" aria-label="Importe"><span>€</span></label>
        ${conBoton ? `<button class="mas" aria-label="Apuntar">${ico('mas1', 24)}</button>` : ''}
      </div>
      <div class="chips" data-temas></div>
      <div class="fila">
        <input class="campo" name="nota" placeholder="Nota (opcional)">
        <input class="campo" name="fecha" type="date" value="${hoyISO()}" aria-label="Fecha">
      </div>
      ${D.conTickets ? `<div class="pila" data-solo-gasto>
        <div class="fila">
          ${campoFoto('Ticket')}
          <button type="button" class="x" data-act="quitarFoto" aria-label="Quitar la foto" hidden>✕</button>
          ${campoQuien(false)}
        </div>
        ${bloqueReparto()}
      </div>` : ''}
      ${proy}
      ${conBoton ? '' : '<button class="boton">Apuntar</button>'}`;
  }

  function campoFoto(texto, attrs = 'data-foto="form"') {
    return `<label class="fotoBtn">${ico('camara', 18)}<span>${esc(texto)}</span><input type="file" accept="image/*" ${attrs} aria-label="Foto del ticket"></label>`;
  }

  function campoQuien(conAmigos) {
    return `<div class="seg segQuien" style="flex:1;min-width:0" role="radiogroup" aria-label="Quién paga">
      <label><input type="radio" name="quien" value="yo" ${conAmigos ? '' : 'checked'}><span>Yo todo</span></label>
      <label><input type="radio" name="quien" value="amigos" ${conAmigos ? 'checked' : ''}><span>Con amigos</span></label>
    </div>`;
  }

  const chipAmigo = (nombre, marcado) => `<label><input type="checkbox" data-amigo value="${esc(nombre)}" ${marcado ? 'checked' : ''}><span>${esc(nombre)}</span></label>`;

  // total: fijo al repartir un gasto ya apuntado; si no, se lee del campo importe.
  function bloqueReparto(total, marcados = []) {
    const nombres = D.amigos.slice();
    marcados.forEach(n => { if (!nombres.includes(n)) nombres.unshift(n); });
    return `<div class="pila" data-reparto ${total ? `data-total="${total}"` : ''} ${marcados.length ? '' : 'hidden'}>
      <div class="etq">¿Con quién?</div>
      <div class="chips" data-amigos>${nombres.map(n => chipAmigo(n, marcados.includes(n))).join('')}</div>
      <div class="fila">
        <input class="campo" data-nuevo-amigo placeholder="Añadir amigo" aria-label="Nombre del amigo" autocapitalize="words">
        <button type="button" class="boton peq sec" data-act="anadirAmigo">Añadir</button>
      </div>
      <div class="pila" data-detalle hidden>
        <div class="seg" role="radiogroup" aria-label="Cómo se reparte">
          <label><input type="radio" name="modo" value="igual" checked><span>A partes iguales</span></label>
          <label><input type="radio" name="modo" value="mano"><span>A mano</span></label>
        </div>
        <div class="pila" data-partes hidden></div>
        <div class="etq">¿Quién ha pagado el ticket?</div>
        <div class="chips" data-pago></div>
        <div class="resumenRep" data-resumen></div>
      </div>
    </div>`;
  }

  const numeroDe = v => Number(String(v == null ? '' : v).trim().replace(/\s|€/g, '').replace(',', '.'));
  const redondear = n => Math.round(n * 100) / 100;
  const amigosMarcados = form => [...form.querySelectorAll('[data-amigo]:checked')].map(i => i.value);

  // Misma cuenta que calcularReparto_ del servidor, para enseñarla antes de guardar.
  function actualizarReparto(form) {
    const b = form.querySelector('[data-reparto]');
    if (!b) return;
    const nombres = amigosMarcados(form);
    b.querySelector('[data-detalle]').hidden = !nombres.length;
    if (!nombres.length) return;

    const clave = nombres.join('|');
    const cajaPago = b.querySelector('[data-pago]');
    if (cajaPago.dataset.n !== clave) {
      const antes = (form.querySelector('[name=pago]:checked') || {}).value || cajaPago.dataset.inicial || '';
      const sigue = nombres.includes(antes) ? antes : '';
      cajaPago.innerHTML = chip('pago', '', 'Yo', !sigue) + nombres.map(n => chip('pago', n, n, n === sigue)).join('');
      cajaPago.dataset.n = clave;
    }
    const aMano = form.querySelector('[name=modo]:checked').value === 'mano';
    const cajaPartes = b.querySelector('[data-partes]');
    cajaPartes.hidden = !aMano;

    const total = redondear(b.dataset.total ? Number(b.dataset.total) : numeroDe((form.querySelector('[name=importe]') || {}).value));
    const igual = total > 0 ? redondear(total / (nombres.length + 1)) : 0;
    if (aMano) {
      if (cajaPartes.dataset.n !== clave) {
        const valores = {};
        cajaPartes.querySelectorAll('[data-parte]').forEach(i => { valores[i.dataset.parte] = i.value; });
        cajaPartes.innerHTML = nombres.map(n => `<div class="parteFila"><span>${esc(n)}</span><input class="campo" data-parte="${esc(n)}" inputmode="decimal" value="${esc(valores[n] || '')}" aria-label="Lo que paga ${esc(n)}"></div>`).join('');
        cajaPartes.dataset.n = clave;
      }
      cajaPartes.querySelectorAll('[data-parte]').forEach(i => { i.placeholder = igual ? igual.toFixed(2).replace('.', ',') : '0,00'; });
    }

    const resumen = b.querySelector('[data-resumen]');
    if (!(total > 0)) { resumen.textContent = 'Escribe el importe para ver cuánto le toca a cada uno.'; return; }
    const partes = nombres.map(persona => {
      const i = aMano ? [...cajaPartes.querySelectorAll('[data-parte]')].find(x => x.dataset.parte === persona) : null;
      return { persona, importe: i && i.value.trim() ? redondear(numeroDe(i.value)) : igual };
    });
    const miParte = redondear(total - partes.reduce((t, x) => t + x.importe, 0));
    if (!(miParte > 0) || partes.some(x => !(x.importe > 0))) {
      resumen.innerHTML = `<span class="neg">Revisa los importes: tu parte tiene que ser más de 0 €.</span>`;
      return;
    }
    const pago = (form.querySelector('[name=pago]:checked') || {}).value || '';
    resumen.innerHTML = `Como gasto se apunta <b>tu parte: ${eur(miParte)}</b> de ${eur(total)}.<br>` + (pago
      ? `Le debes ${eur(miParte)} a ${esc(pago)}.`
      : partes.map(x => `${esc(x.persona)} te debe ${eur(x.importe)}.`).join('<br>'));
  }

  // null: lo pagas tú todo. false: falta algo y ya se ha avisado.
  function leerReparto(form) {
    const quien = form.querySelector('[name=quien]:checked');
    if (!quien || quien.value !== 'amigos') return null;
    const nombres = amigosMarcados(form);
    if (!nombres.length) { avisar('Elige con quién lo pagas'); return false; }
    const aMano = form.querySelector('[name=modo]:checked').value === 'mano';
    return {
      amigos: nombres.map(persona => {
        const i = aMano ? [...form.querySelectorAll('[data-parte]')].find(x => x.dataset.parte === persona) : null;
        return { persona, importe: i ? i.value.trim() : '' };
      }),
      pago: (form.querySelector('[name=pago]:checked') || {}).value || '',
    };
  }

  function anadirAmigo(form) {
    const campo = form.querySelector('[data-nuevo-amigo]');
    const nombre = campo.value.trim();
    if (!nombre) return;
    const existente = [...form.querySelectorAll('[data-amigo]')].find(i => i.value.toLowerCase() === nombre.toLowerCase());
    if (existente) existente.checked = true;
    else form.querySelector('[data-amigos]').insertAdjacentHTML('beforeend', chipAmigo(nombre, true));
    campo.value = '';
    actualizarReparto(form);
  }

  // La foto se comprime en el móvil antes de subirla: una de 5 MB se queda en unos 500 KB.
  function comprimirFoto(file) {
    return new Promise((ok, ko) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const lienzo = (w, h) => {
          const c = document.createElement('canvas');
          c.width = w;
          c.height = h;
          const g = c.getContext('2d');
          g.fillStyle = '#fff';
          g.fillRect(0, 0, w, h);
          return [c, g];
        };
        const iw = img.naturalWidth, ih = img.naturalHeight;
        const k = Math.min(1, 1800 / Math.max(iw, ih));
        const w = Math.round(iw * k), h = Math.round(ih * k);
        const [c, g] = lienzo(w, h);
        g.drawImage(img, 0, 0, w, h);
        // Miniatura con la parte de arriba del ticket, que es donde sale la tienda.
        const mw = 150, mh = 200;
        const [cm, gm] = lienzo(mw, mh);
        const r = Math.max(mw / iw, mh / ih);
        gm.drawImage(img, (mw - iw * r) / 2, 0, iw * r, ih * r);
        ok({ foto: c.toDataURL('image/jpeg', 0.72), mini: cm.toDataURL('image/jpeg', 0.5) });
      };
      img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('imagen')); };
      img.src = url;
    });
  }

  async function elegirFoto(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const form = input.closest('form');
    let foto;
    try {
      foto = await comprimirFoto(file);
    } catch (e) {
      input.value = '';
      avisar('No he podido leer esa imagen');
      return;
    }
    input.value = '';
    // En el detalle de un gasto ya apuntado se sube al momento.
    if (input.dataset.mov) {
      const id = input.dataset.mov;
      avisar('Subiendo ticket…');
      delete FOTOS[id];
      if (await hacer('ticketMov', { id, foto: foto.foto, mini: foto.mini })) MODALES.verMov({ dataset: { id } });
      return;
    }
    form._foto = foto;
    form.dataset.sucio = '1';
    pintarFotoForm(form);
  }

  function pintarFotoForm(form) {
    const btn = form.querySelector('[data-foto="form"]').closest('.fotoBtn');
    const quitar = form.querySelector('[data-act=quitarFoto]');
    const puesta = !!form._foto;
    btn.classList.toggle('puesta', puesta);
    btn.querySelector('svg, img').outerHTML = puesta ? `<img src="${esc(form._foto.mini)}" alt="">` : ico('camara', 18);
    quitar.hidden = !puesta;
  }

  function prepararFormMov(form) {
    const pintarTemas = () => {
      const tipo = form.querySelector('[name=tipo]:checked').value;
      const soloGasto = form.querySelector('[data-solo-gasto]');
      if (soloGasto) soloGasto.hidden = tipo !== 'gasto';
      form.querySelector('[data-temas]').innerHTML = D.temas.filter(t => t.tipo === tipo)
        .map(t => chip('tema', t.tema, t.tema, false, tipo === 'gasto' ? colorTema(t.tema) : '')).join('');
    };
    form.querySelectorAll('[name=tipo]').forEach(r => r.addEventListener('change', pintarTemas));
    pintarTemas();
  }

  async function enviarMov(form) {
    const f = Object.fromEntries(new FormData(form));
    if (!f.importe) { avisar('Escribe el importe'); return false; }
    if (!f.tema) { avisar('Elige un tema'); return false; }
    if (f.fecha === hoyISO()) f.fecha = '';
    if (f.tipo !== 'ingreso') {
      const rep = leerReparto(form);
      if (rep === false) return false;
      if (rep) Object.assign(f, rep);
      if (form._foto) {
        Object.assign(f, form._foto);
        avisar('Subiendo ticket…');
      }
    }
    delete f.quien;
    delete f.modo;
    mes = f.fecha ? f.fecha.slice(0, 7) : D.hoy;
    return hacer('mov', f);
  }

  const VISTAS = {
    inicio() {
      const dif = D.anterior > 0 ? Math.round((D.gastos - D.anterior) / D.anterior * 100) : null;
      const max = Math.max(1, ...D.diario);
      const barras = D.diario.map((v, i) => {
        const fut = i + 1 > D.dias;
        return `<button type="button" class="${fut ? 'futuro' : ''}" data-act="verDia" data-dia="${i + 1}" data-v="${v}" aria-label="Día ${i + 1}: ${eur(v)}"><i style="height:${fut ? 3 : Math.max(3, v / max * 56)}px"></i></button>`;
      }).join('');
      const top = D.porTema[0] && D.porTema[0].total > 0 ? D.porTema[0] : null;
      const presu = D.porTema.filter(t => t.presupuesto > 0);
      const sinPresu = D.porTema.filter(t => !t.presupuesto && t.total > 0).slice(0, 3);
      const totalAhorrado = D.huchas.reduce((s, h) => s + h.ahorrado, 0);
      const proximos = D.fijos.filter(f => (new Date(f.proximo + 'T12:00:00') - new Date()) / 864e5 <= 7);

      return `<div class="grid">
        <div class="hero span2">
          <div class="cabtile" style="margin:0"><div class="et">Gastado en ${esc(nombreMes(mes))}</div>
            ${dif === null ? '' : `<div class="pildora">${dif > 0 ? '+' : ''}${dif} % vs ${esc(mesCorto(moverMes(mes, -1)))}</div>`}</div>
          <div class="big">${eur(D.gastos)}</div>
          <div class="barras" role="group" aria-label="Gasto de cada día">${barras}</div>
          <div class="eje"><span>1</span><span>${Math.ceil(D.diasMes / 2)}</span><span>${D.diasMes}</span></div>
        </div>

        <div class="tile">
          ${D.ingresos > 0
            ? `<div class="et">Te quedan</div><div class="val ${D.queda < 0 ? 'neg' : ''}">${eur(D.queda)}</div><div class="sub">Entró ${eur(D.ingresos)}${D.ahorradoMes ? ' · ahorro ' + eur(D.ahorradoMes) : ''}</div>`
            : `<div class="et">Te quedan</div><div class="val" style="color:var(--dim)">—</div><div class="sub">Apunta tus ingresos para verlo</div>`}
        </div>
        <div class="tile"><div class="et">Media diaria</div><div class="val">${eur(D.dias ? D.gastos / D.dias : 0)}</div><div class="sub">${D.dias} ${D.dias === 1 ? 'día' : 'días'}</div></div>
        <div class="tile"><div class="et">Donde más</div><div class="val">${top ? esc(top.tema) : '—'}</div><div class="sub">${top ? eur(top.total) + ' · ' + Math.round(top.total / D.gastos * 100) + ' %' : 'Sin gastos'}</div></div>
        <div class="tile"><div class="et">Días sin gastar</div><div class="val">${D.sinGastar}</div><div class="sub">Racha: ${D.racha} ${D.racha === 1 ? 'día' : 'días'}</div></div>

        <form class="tile span2 pila" id="rapido" data-form="mov" autocomplete="off">
          <div class="et">Apuntar</div>
          ${formMov(true)}
        </form>

        ${presu.map(t => {
          const uso = t.total / t.presupuesto;
          const c = uso > 1 ? 'var(--bad)' : uso >= 0.8 ? 'var(--warn)' : 'var(--accent)';
          return `<div class="tile" style="${uso > 1 ? 'border-color:#5a2621' : ''}">
            <div class="cabtile" style="margin:0"><div class="et">${esc(t.tema)}</div><div class="pildora" style="background:${c};color:var(--ink)">${Math.round(uso * 100)} %</div></div>
            <div class="val" style="font-size:22px">${eur(t.total)}</div>
            <div class="prog"><i style="width:${Math.min(100, uso * 100)}%;background:${c}"></i></div>
            <div class="sub">${uso > 1 ? 'Pasado ' + eur(t.total - t.presupuesto) : 'Quedan ' + eur(t.presupuesto - t.total)}</div>
          </div>`;
        }).join('')}
        ${sinPresu.length ? `<div class="tile ${presu.length % 2 ? '' : 'span2'}"><div class="et">Sin presupuesto</div>
          <div style="font-size:14px;line-height:1.7;margin-top:6px">${sinPresu.map(t => `${esc(t.tema)} <span style="color:var(--muted)">${eur(t.total)}</span>`).join('<br>')}</div></div>` : ''}

        ${proximos.length ? `<div class="tile span2"><div class="cabtile"><div class="et">Próximos cobros</div><button type="button" class="enlace" data-tab="fijos">Ver fijos</button></div>
          <div class="lista">${proximos.map(f => `<div class="item"><span class="punto" style="background:${colorTema(f.tema)}"></span><div class="que"><b>${esc(f.nombre)}</b><small>${fechaCorta(f.proximo)}</small></div><div class="cifra">${eur(f.importe)}</div></div>`).join('')}</div></div>` : ''}

        ${D.huchas.length ? `<div class="tile span2"><div class="cabtile"><div class="et">Ahorrado</div><button type="button" class="enlace" data-tab="ahorro">Ver huchas</button></div>
          <div class="val">${eur(totalAhorrado)}</div>
          ${D.huchas.slice(0, 2).map(h => `<div style="margin-top:10px"><div class="cabtile" style="margin:0;font-size:13px"><span>${esc(h.nombre)}</span><span style="color:var(--muted)">${eur(h.ahorrado)} / ${eur(h.meta)}</span></div><div class="prog"><i style="width:${Math.min(100, h.ahorrado / h.meta * 100)}%"></i></div></div>`).join('')}
        </div>` : ''}

        <div class="tile span2"><div class="cabtile"><div class="et">Últimos</div><button type="button" class="enlace" data-tab="movs">Ver todos</button></div>
          <div class="lista">${D.movs.length ? D.movs.slice(0, 5).map(m => filaMov(m)).join('') : vacio('Nada apuntado este mes.')}</div>
        </div>
      </div>`;
    },

    movs() {
      const lista = D.movs.filter(m => filtroMovs === 'todos' || m.tipo === filtroMovs);
      let html = '', dia = '';
      lista.forEach(m => {
        if (m.dia !== dia) { dia = m.dia; html += `<div class="dia">${fechaLarga(dia)}</div>`; }
        html += filaMov(m, true);
      });
      return `<div class="pila">
        <div class="grid">
          <div class="tile"><div class="et">Gastos</div><div class="val">${eur(D.gastos)}</div></div>
          <div class="tile"><div class="et">Ingresos</div><div class="val pos">${eur(D.ingresos)}</div></div>
        </div>
        <div class="fila">
          <div class="seg" style="flex:1" role="radiogroup" aria-label="Filtrar">
            ${['todos', 'gasto', 'ingreso'].map(f => `<label><input type="radio" name="filtro" value="${f}" data-act="filtro" ${filtroMovs === f ? 'checked' : ''}><span>${{ todos: 'Todos', gasto: 'Gastos', ingreso: 'Ingresos' }[f]}</span></label>`).join('')}
          </div>
          <button type="button" class="mas" style="height:44px" data-act="nuevoMov" aria-label="Apuntar movimiento">${ico('mas1', 22)}</button>
        </div>
        <div class="tile lista" style="padding-top:4px">${html || vacio('Nada por aquí.')}</div>
      </div>`;
    },

    ahorro() {
      const total = D.huchas.reduce((s, h) => s + h.ahorrado, 0);
      return `<div class="pila">
        <div class="hero"><div class="et">Ahorrado en total</div><div class="big">${eur(total)}</div>
          <div class="et" style="font-weight:500">${D.ahorradoMes ? (D.ahorradoMes > 0 ? '+' : '') + eur(D.ahorradoMes) + ' este mes' : 'Crea una hucha y ve llenándola'}</div></div>
        ${D.huchas.map(h => {
          const pct = Math.min(100, Math.round(h.ahorrado / h.meta * 100));
          const hecho = h.ahorrado >= h.meta;
          return `<div class="tile">
            <div class="cabtile"><b style="font-size:17px">${esc(h.nombre)}</b>${borrar('borrarHucha', `data-id="${esc(h.id)}"`)}</div>
            <div class="fila" style="justify-content:space-between;align-items:baseline"><div class="val">${eur(h.ahorrado)}</div><div class="sub">de ${eur(h.meta)} · ${pct} %</div></div>
            <div class="prog" style="height:10px;border-radius:5px"><i style="width:${pct}%"></i></div>
            <div class="sub">${hecho ? '¡Conseguido!' : h.fin ? 'A este ritmo, lo tendrás en ' + nombreMes(h.fin) + ' de ' + h.fin.slice(0, 4) : 'Añade dinero para calcular cuándo llegarás'}</div>
            <div class="fila" style="margin-top:12px">
              <button type="button" class="boton peq" style="flex:1" data-act="aportar" data-id="${esc(h.id)}">Añadir</button>
              <button type="button" class="boton peq sec" style="flex:1" data-act="sacar" data-id="${esc(h.id)}">Sacar</button>
            </div>
          </div>`;
        }).join('')}
        <button type="button" class="boton sec" data-act="nuevaHucha">Nueva hucha</button>
        <div class="nota">Lo que metes en una hucha cuenta como ahorro del mes y se resta de "Te quedan".</div>
      </div>`;
    },

    fijos() {
      const mensual = D.fijos.reduce((s, f) => s + f.importe, 0);
      return `<div class="pila">
        <div class="hero"><div class="et">Al año pagas</div><div class="big">${eur(mensual * 12)}</div>
          <div class="et" style="font-weight:500">${eur(mensual)} al mes en ${D.fijos.length} ${D.fijos.length === 1 ? 'gasto fijo' : 'gastos fijos'}</div></div>
        <div class="tile lista">${D.fijos.length ? D.fijos.map(f => `<div class="item">
            <span class="punto" style="background:${colorTema(f.tema)}"></span>
            <div class="que"><b>${esc(f.nombre)}</b><small>Próximo cobro ${fechaCorta(f.proximo)} · ${esc(f.tema)}</small></div>
            <div class="cifra">${eur(f.importe)}</div>${borrar('borrarFijo', `data-id="${esc(f.id)}"`)}
          </div>`).join('') : vacio('Añade Spotify, el gimnasio, el móvil…')}</div>
        <button type="button" class="boton sec" data-act="nuevoFijo">Añadir gasto fijo</button>
        <div class="nota">Se apuntan solos el día de cobro y el día antes te llega un correo.</div>
      </div>`;
    },

    tickets() {
      const lista = D.movs.filter(m => m.ticket);
      return `<div class="pila">
        <button type="button" class="boton" data-act="nuevoTicket">Subir ticket</button>
        ${lista.length ? `<div class="galeria">${lista.map(m => `<button type="button" data-act="verMov" data-id="${esc(m.id)}" aria-label="Ticket de ${esc(m.nota || m.tema)}, ${eur(m.total || m.importe)}">
            ${m.mini ? `<img class="foto" src="${esc(m.mini)}" alt="">` : `<span class="foto">${ico('tickets', 26)}</span>`}
            <span class="pie"><b>${eur(m.total || m.importe)}</b><small>${esc(m.nota || m.tema)}</small><small>${fechaCorta(m.dia)}</small></span>
          </button>`).join('')}</div>` : `<div class="tile">${vacio('Aún no hay tickets en ' + esc(nombreMes(mes)) + '.')}</div>`}
        <div class="nota">¿Ya lo apuntaste con el atajo? Toca el gasto en Movimientos y añádele el ticket. Las fotos se guardan en la carpeta «Lima - Tickets» de tu Drive.</div>
      </div>`;
    },

    mas() {
      const teDeben = D.deudas.filter(d => !d.pagada && d.sentido === 'me_debe').reduce((s, d) => s + d.importe, 0);
      const esperando = D.deseos.filter(d => d.estado === 'esperando').length;
      const nTickets = D.movs.filter(m => m.ticket).length;
      const filas = [
        ...(D.conTickets ? [['tickets', nTickets ? nTickets + (nTickets === 1 ? ' ticket' : ' tickets') + ' en ' + nombreMes(mes) : 'Fotos de tus compras']] : []),
        ['proyectos', D.proyectos.length ? D.proyectos.length + (D.proyectos.length === 1 ? ' proyecto' : ' proyectos') : '¿Ganan o pierden dinero?'],
        ['deudas', teDeben ? 'Te deben ' + eur(teDeben) : 'Préstamos entre amigos'],
        ['deseos', esperando ? esperando + ' esperando 48 h' : 'Piénsalo antes de comprar'],
        ['stats', 'Calendario, rachas y meses'],
        ['temas', 'Presupuestos y temas'],
        ['conexiones', 'Resumen del domingo, widget e ingresos'],
      ];
      return `<div class="menu">${filas.map(([id, sub]) => `<button type="button" data-sub="${id}">
          <span class="ico">${ico(id)}</span><span class="que"><b>${SUB[id]}</b><small>${esc(sub)}</small></span><span class="flecha">›</span>
        </button>`).join('')}</div>
        <div class="nota" style="text-align:center;margin-top:20px"><a href="${esc(D.urlHoja)}" target="_blank" style="color:var(--muted)">Abrir la hoja de Google</a></div>`;
    },

    proyectos() {
      return `<div class="pila">
        ${D.proyectos.map(p => {
          const bal = p.ingresos - p.gastos;
          return `<div class="tile">
            <div class="cabtile"><b style="font-size:17px">${esc(p.nombre)}</b>${borrar('borrarProyecto', `data-nombre="${esc(p.nombre)}"`)}</div>
            <div class="val ${bal >= 0 ? 'pos' : 'neg'}">${bal > 0 ? '+' : ''}${eur(bal)}</div>
            <div class="sub">Gastos ${eur(p.gastos)} · Ingresos ${eur(p.ingresos)} · ${p.movimientos} mov.</div>
            ${p.gastosMes || p.ingresosMes ? `<div class="sub" style="margin-top:4px">En ${esc(nombreMes(mes))}: −${eur(p.gastosMes)} / +${eur(p.ingresosMes)}</div>` : ''}
          </div>`;
        }).join('') || vacio('Aún no hay proyectos.')}
        <form class="fila" data-form="proyecto" autocomplete="off"><input class="campo" name="nombre" placeholder="Nuevo proyecto (KDP, STL…)"><button class="boton peq">Añadir</button></form>
        <div class="nota">Al apuntar un gasto o ingreso, elige su proyecto y aquí verás si gana o pierde dinero.</div>
      </div>`;
    },

    deudas() {
      const pend = D.deudas.filter(d => !d.pagada);
      const pagadas = D.deudas.filter(d => d.pagada).slice(0, 10);
      const suma = s => pend.filter(d => d.sentido === s).reduce((t, d) => t + d.importe, 0);
      const fila = d => `<div class="item">
          <div class="que"><b>${esc(d.persona)}</b><small>${esc(d.concepto || (d.sentido === 'me_debe' ? 'Te debe' : 'Le debes'))} · ${fechaCorta(d.dia)}</small></div>
          <div class="cifra ${d.sentido === 'me_debe' ? 'pos' : ''}" style="${d.sentido === 'debo' ? 'color:var(--warn)' : ''}">${eur(d.importe)}</div>
          ${d.pagada ? '' : `<button type="button" class="boton peq sec" data-act="pagarDeuda" data-id="${esc(d.id)}">Pagada</button>`}
          ${borrar('borrarDeuda', `data-id="${esc(d.id)}"`)}
        </div>`;
      return `<div class="pila">
        <div class="grid">
          <div class="tile"><div class="et">Te deben</div><div class="val pos">${eur(suma('me_debe'))}</div></div>
          <div class="tile"><div class="et">Debes</div><div class="val" style="color:var(--warn)">${eur(suma('debo'))}</div></div>
        </div>
        <div class="tile lista">${pend.length ? pend.map(fila).join('') : vacio('Todo saldado.')}</div>
        <button type="button" class="boton sec" data-act="nuevaDeuda">Apuntar deuda</button>
        <div class="nota">Cuando te devuelvan el dinero, márcala como pagada. No lo apuntes también como ingreso: como gasto ya solo contaba tu parte.</div>
        ${pagadas.length ? `<div class="dia">Pagadas</div><div class="tile lista" style="opacity:.7">${pagadas.map(fila).join('')}</div>` : ''}
      </div>`;
    },

    deseos() {
      const esperando = D.deseos.filter(d => d.estado === 'esperando');
      const decididos = D.deseos.filter(d => d.estado !== 'esperando').slice(0, 15);
      const ahorrado = D.deseos.filter(d => d.estado === 'descartado').reduce((s, d) => s + d.precio, 0);
      return `<div class="pila">
        <div class="hero"><div class="et">Ahorrado sin comprar</div><div class="big">${eur(ahorrado)}</div>
          <div class="et" style="font-weight:500">Apunta lo que quieres y espera 48 h antes de decidir</div></div>
        <form class="tile pila" data-form="deseo" autocomplete="off">
          <div class="fila"><input class="campo" name="nombre" placeholder="¿Qué quieres?"><input class="campo" name="precio" inputmode="decimal" placeholder="Precio" style="flex:0 0 100px"></div>
          <button class="boton peq">Apuntar deseo</button>
        </form>
        ${esperando.map(d => {
          const listo = d.horas >= 48;
          return `<div class="tile">
            <div class="cabtile"><b style="font-size:16px">${esc(d.nombre)}</b><div class="fila"><span class="cifra">${eur(d.precio)}</span>${borrar('borrarDeseo', `data-id="${esc(d.id)}"`)}</div></div>
            ${listo
              ? `<div class="sub">Han pasado 48 h. ¿Lo sigues queriendo?</div>
                 <div class="fila" style="margin-top:10px"><button type="button" class="boton peq" style="flex:1" data-act="comprar" data-id="${esc(d.id)}">Lo compro</button><button type="button" class="boton peq sec" style="flex:1" data-act="descartar" data-id="${esc(d.id)}">Ya no lo quiero</button></div>`
              : `<div class="prog"><i style="width:${d.horas / 48 * 100}%;background:var(--warn)"></i></div><div class="sub">Podrás decidir en ${48 - d.horas} h</div>`}
          </div>`;
        }).join('')}
        ${decididos.length ? `<div class="dia">Decididos</div><div class="tile lista">${decididos.map(d => `<div class="item"><div class="que"><b>${esc(d.nombre)}</b><small>${d.estado === 'comprado' ? 'Comprado' : 'Descartado'}</small></div><div class="cifra ${d.estado === 'descartado' ? 'pos' : ''}">${eur(d.precio)}</div>${borrar('borrarDeseo', `data-id="${esc(d.id)}"`)}</div>`).join('')}</div>` : ''}
      </div>`;
    },

    stats() {
      const s = D.stats;
      const max = Math.max(1, ...D.diario);
      // Una sola tinta (lima) de menos a más, sobre el fondo oscuro.
      const tono = v => v <= 0 ? 'var(--track)' : `rgba(200,241,105,${(0.25 + 0.75 * Math.min(1, v / max)).toFixed(2)})`;
      let cal = ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(d => `<div class="ds">${d}</div>`).join('');
      for (let i = 1; i < D.primerDiaSemana; i++) cal += '<div></div>';
      D.diario.forEach((v, i) => {
        const fut = i + 1 > D.dias;
        const fondo = fut ? 'transparent' : tono(v);
        const color = fut ? 'var(--dim)' : v > max * 0.45 ? 'var(--ink)' : 'var(--text2)';
        cal += `<button type="button" data-act="verDia" data-dia="${i + 1}" data-v="${v}" style="background:${fondo};color:${color};${fut ? 'border:1px dashed var(--line2)' : ''}" aria-label="Día ${i + 1}: ${eur(v)}">${i + 1}</button>`;
      });
      const maxMes = Math.max(1, ...s.meses.map(m => m.gastos));
      const maxSem = Math.max(...s.semana);
      const semMax = s.semana.indexOf(maxSem);
      return `<div class="pila">
        <div class="grid">
          <div class="tile"><div class="et">Racha sin gastar</div><div class="val">${D.racha} ${D.racha === 1 ? 'día' : 'días'}</div><div class="sub">Sin contar los fijos</div></div>
          <div class="tile"><div class="et">Días sin gastar</div><div class="val">${D.sinGastar}</div><div class="sub">en ${esc(nombreMes(mes))}</div></div>
        </div>
        <div class="tile"><div class="et" style="margin-bottom:10px">Calendario de ${esc(nombreMes(mes))}</div><div class="cal">${cal}</div>
          <div class="ley">Menos <i style="background:var(--track)"></i><i style="background:rgba(200,241,105,.35)"></i><i style="background:rgba(200,241,105,.65)"></i><i style="background:var(--accent)"></i> Más · toca un día</div></div>
        <div class="tile"><div class="et" style="margin-bottom:12px">Gasto de los últimos 6 meses</div>
          <div class="barrasv">${s.meses.map(m => `<div class="col ${m.mes === mes ? '' : 'tenue'}"><em>${m.gastos ? Math.round(m.gastos) + ' €' : ''}</em><i style="height:${Math.max(2, m.gastos / maxMes * 90)}px"></i><span>${mesCorto(m.mes)}</span></div>`).join('')}</div></div>
        <div class="tile"><div class="et" style="margin-bottom:12px">Media por día de la semana · últimos 3 meses</div>
          <div class="barrasv">${s.semana.map((v, i) => `<div class="col ${i === semMax && maxSem > 0 ? '' : 'tenue'}"><em>${v ? Math.round(v) + ' €' : ''}</em><i style="height:${Math.max(2, v / Math.max(1, maxSem) * 90)}px"></i><span>${'LMXJVSD'[i]}</span></div>`).join('')}</div>
          ${maxSem > 0 ? `<div class="sub" style="margin-top:10px">Gastas más los ${['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábados', 'domingos'][semMax]}.</div>` : ''}</div>
        <div class="tile"><div class="et">Dónde más gastas · últimos 3 meses</div>
          <div class="lista" style="margin-top:6px">${s.top.length ? s.top.map((t, i) => `<div class="item"><span class="cifra" style="color:var(--dim);width:18px">${i + 1}</span><div class="que"><b>${esc(t.nota)}</b><small>${t.veces} ${t.veces === 1 ? 'vez' : 'veces'}</small></div><div class="cifra">${eur(t.total)}</div></div>`).join('') : vacio('Escribe notas en tus gastos para ver aquí dónde gastas.')}</div></div>
      </div>`;
    },

    temas() {
      const bloque = tipo => D.temas.filter(t => t.tipo === tipo).map(t => `<div class="item">
          <span class="punto" style="background:${colorTema(t.tema, tipo)}"></span><div class="que"><b>${esc(t.tema)}</b></div>
          ${tipo === 'gasto' ? `<input class="campo" style="width:104px;text-align:right" inputmode="decimal" placeholder="Sin límite" value="${t.presupuesto ? String(t.presupuesto).replace('.', ',') : ''}" data-presu="${esc(t.tema)}" aria-label="Presupuesto de ${esc(t.tema)}">` : ''}
          ${borrar('borrarTema', `data-tema="${esc(t.tema)}" data-tipo="${tipo}"`)}
        </div>`).join('');
      return `<div class="pila">
        <div class="dia" style="margin-top:0">Gastos · presupuesto al mes</div><div class="tile lista">${bloque('gasto')}</div>
        <div class="dia">Ingresos</div><div class="tile lista">${bloque('ingreso')}</div>
        <form class="tile pila" data-form="tema" autocomplete="off">
          <div class="seg"><label><input type="radio" name="tipo" value="gasto" checked><span>Gasto</span></label><label><input type="radio" name="tipo" value="ingreso"><span>Ingreso</span></label></div>
          <div class="fila"><input class="campo" name="tema" placeholder="Nuevo tema"><button class="boton peq">Añadir</button></div>
        </form>
        <div class="nota">Si añades un tema, añádelo también a la lista del atajo, escrito igual.</div>
      </div>`;
    },

    conexiones() {
      const base = D.urlApp + '?k=' + encodeURIComponent(K);
      const copiable = txt => `<input class="campo" readonly value="${esc(txt)}" data-copiar style="font-size:12px;margin-top:8px" aria-label="Dirección para copiar">`;
      return `<div class="pila">
        <div class="tile"><b>Dirección para tus atajos</b>
          <div class="sub" style="margin-top:6px;line-height:1.5">Pégala en la primera acción de los atajos Gasto e Ingreso. No la compartas: lleva tu clave.</div>
          ${copiable(base)}
          <button type="button" class="boton peq" style="margin-top:10px" data-act="copiarAtajos" data-texto="${esc(base)}">Copiar dirección</button></div>
        <div class="tile"><b>Resumen del domingo</b>
          <div class="sub" style="margin-top:6px;line-height:1.5">En Dreceres → Automatització → Nova automatització → Hora del dia: diumenge 21:00 → Executa immediatament. Acciones: <b>Obtén el contingut de l'URL</b> con esta dirección y <b>Mostra una notificació</b> con el resultado.</div>
          ${copiable(base + '&accion=resumen')}</div>
        <div class="tile"><b>Widget con lo gastado</b>
          <div class="sub" style="margin-top:6px;line-height:1.5">Instala la app gratis <b>Scriptable</b>. Abre este enlace en el iPhone, copia todo el texto, pégalo en un script nuevo de Scriptable y llámalo Lima. Luego añade un widget de Scriptable a la pantalla de inicio y elige ese script.</div>
          <a class="boton peq sec" style="display:inline-flex;align-items:center;margin-top:10px;text-decoration:none" href="${esc(base + '&accion=scriptable')}" target="_blank">Abrir el código del widget</a></div>
        <div class="tile"><b>Atajo "Ingreso"</b>
          <div class="sub" style="margin-top:6px;line-height:1.5">Duplica el atajo Gasto y llámalo Ingreso. Cambia la lista por: ${D.temas.filter(t => t.tipo === 'ingreso').map(t => esc(t.tema)).join(', ')}. En el JSON añade un campo de texto <b>tipo</b> con el valor <b>ingreso</b>.</div></div>
        <div class="tile"><b>Avisos de cobros</b>
          <div class="sub" style="margin-top:6px;line-height:1.5">El día antes de cada gasto fijo te llega un correo a tu Gmail. Activa las notificaciones de Gmail en el iPhone para verlo.</div></div>
      </div>`;
    },
  };

  function filaMov(m, conBorrar) {
    const ing = m.tipo === 'ingreso';
    const extra = [m.total ? 'Tu parte de ' + eur(m.total) : '', m.nota ? m.tema : '', m.proyecto, m.origen === 'fijo' ? 'fijo' : '', conBorrar ? m.hora : fechaCorta(m.dia)].filter(Boolean).join(' · ');
    // Los gastos se abren para añadir el ticket o repartirlos.
    const abrir = D.conTickets && !ing;
    return `<div class="item">
      <span class="punto" style="background:${colorTema(m.tema, m.tipo)}"></span>
      ${abrir ? `<button type="button" class="que toque" data-act="verMov" data-id="${esc(m.id)}">` : '<div class="que">'}<b>${esc(m.nota || m.tema)}</b><small>${esc(extra)}</small>${abrir ? '</button>' : '</div>'}
      ${m.ticket ? `<span class="marca" title="Con ticket">${ico('tickets', 16)}</span>` : ''}
      <div class="cifra ${ing ? 'pos' : ''}">${ing ? '+' : '−'}${eur(m.importe)}</div>
      ${conBorrar ? borrar('borrarMov', `data-id="${esc(m.id)}"`) : ''}
    </div>`;
  }

  // ---------- Hoja inferior ----------

  function abrirModal(titulo, cuerpo, guardar) {
    $('modalTitulo').textContent = titulo;
    $('modalCuerpo').innerHTML = cuerpo;
    $('modal')._foto = null;
    alGuardar = guardar;
    $('velo').hidden = false;
    const primero = $('modalCuerpo').querySelector('input:not([type=radio]):not([type=date]):not([type=file]):not([type=checkbox]):not([data-nuevo-amigo])');
    if (primero) setTimeout(() => primero.focus(), 50);
  }
  function cerrarModal() { $('velo').hidden = true; alGuardar = null; }
  $('cerrar').onclick = cerrarModal;
  $('velo').addEventListener('click', e => { if (e.target === $('velo')) cerrarModal(); });
  $('modal').addEventListener('submit', async e => {
    e.preventDefault();
    if (!alGuardar) return;
    const boton = $('modal').querySelector('.boton:not([type=button])');
    if (boton) boton.disabled = true;
    const ok = await alGuardar(Object.fromEntries(new FormData($('modal'))));
    if (boton) boton.disabled = false;
    if (ok) cerrarModal();
  });

  const campoImporte = (name, ph) => `<div class="importe"><label><input name="${name}" inputmode="decimal" placeholder="${ph || '0,00'}" aria-label="${ph || 'Importe'}"><span>€</span></label></div>`;
  const opcionesTema = sel => `<div class="chips">${D.temas.filter(t => t.tipo === 'gasto').map(t => chip('tema', t.tema, t.tema, t.tema === sel, colorTema(t.tema))).join('')}</div>`;

  // Fotos ya pedidas al servidor, para no volver a descargarlas.
  const FOTOS = {};

  async function cargarFotoGrande(m) {
    const caja = $('modalCuerpo').querySelector('[data-foto-grande]');
    try {
      const r = FOTOS[m.id] || (FOTOS[m.id] = await run('ticket', m.id));
      if (caja.isConnected) caja.innerHTML = `<img src="${esc(r.foto)}" alt="Ticket de ${esc(m.nota || m.tema)}">`;
    } catch (e) {
      if (caja.isConnected) caja.innerHTML = vacio('No se ha podido cargar la foto. ' + esc(e.message));
    }
  }

  const MODALES = {
    nuevoMov() {
      abrirModal('Apuntar', formMov(false), () => enviarMov($('modal')));
      prepararFormMov($('modal'));
    },
    nuevoTicket() {
      abrirModal('Subir ticket', formMov(false), () => enviarMov($('modal')));
      prepararFormMov($('modal'));
    },
    verMov(el) {
      const m = D.movs.find(x => x.id === el.dataset.id);
      if (!m) return;
      const compartido = m.total > 0;
      const marcados = compartido ? m.reparto.split(', ').filter(Boolean) : [];
      abrirModal(m.nota || m.tema, `<div>
          <div class="val" style="font-size:30px;font-weight:700">${eur(m.importe)}</div>
          <div class="sub">${esc(m.tema)} · ${fechaCorta(m.dia)}${compartido ? ` · tu parte de ${eur(m.total)}` : ''}</div>
        </div>
        ${m.ticket
          ? `<div class="fotoGrande" data-foto-grande><div class="vacio">Cargando la foto…</div></div>
             <div class="fila">
               ${campoFoto('Cambiar', `data-mov="${esc(m.id)}"`)}
               ${m.urlTicket ? `<a class="enlace" style="flex:1;text-decoration:none" href="${esc(m.urlTicket)}" target="_blank" rel="noopener">Abrir en Drive</a>` : '<span style="flex:1"></span>'}
               ${borrar('quitarTicket', `data-id="${esc(m.id)}"`)}
             </div>`
          : `<div class="fila">${campoFoto('Añadir ticket', `data-mov="${esc(m.id)}"`)}</div>`}
        <div class="etq">¿Quién lo paga?</div>
        ${campoQuien(compartido)}
        ${bloqueReparto(m.total || m.importe, marcados)}
        <button class="boton" data-guardar-reparto ${compartido ? 'data-compartido="1"' : 'hidden'}>Guardar reparto</button>`, () => {
        const rep = leerReparto($('modal'));
        if (rep === false) return false;
        return hacer('repartirMov', { id: m.id, amigos: rep ? rep.amigos : [], pago: rep ? rep.pago : '' });
      });
      const cajaPago = $('modal').querySelector('[data-pago]');
      cajaPago.dataset.inicial = m.pago;
      actualizarReparto($('modal'));
      if (m.ticket) cargarFotoGrande(m);
    },
    nuevaHucha() {
      abrirModal('Nueva hucha', `<input class="campo" name="nombre" placeholder="Viaje de verano, ordenador…">${campoImporte('meta', 'Meta')}<button class="boton">Crear hucha</button>`, f => hacer('hucha', f));
    },
    aportar(el) {
      const h = D.huchas.find(x => x.id === el.dataset.id);
      abrirModal('Añadir a ' + h.nombre, `${campoImporte('importe')}<button class="boton">Añadir</button>`, f => hacer('aporte', { hucha: h.id, importe: f.importe }));
    },
    sacar(el) {
      const h = D.huchas.find(x => x.id === el.dataset.id);
      abrirModal('Sacar de ' + h.nombre, `${campoImporte('importe')}<div class="sub">Tienes ${eur(h.ahorrado)}.</div><button class="boton">Sacar</button>`, f => hacer('aporte', { hucha: h.id, importe: f.importe, sacar: true }));
    },
    nuevoFijo() {
      abrirModal('Gasto fijo', `<input class="campo" name="nombre" placeholder="Spotify, gimnasio, móvil…">
        <div class="fila">${campoImporte('importe')}<input class="campo" name="dia" inputmode="numeric" placeholder="Día 1-31" style="flex:0 0 104px" aria-label="Día del mes"></div>
        <div class="etq">Tema</div>${opcionesTema('Suscripciones')}
        <button class="boton">Añadir</button>`, f => hacer('fijo', f));
    },
    nuevaDeuda() {
      abrirModal('Apuntar deuda', `<div class="seg"><label><input type="radio" name="sentido" value="me_debe" checked><span>Me debe</span></label><label><input type="radio" name="sentido" value="debo"><span>Le debo</span></label></div>
        <input class="campo" name="persona" placeholder="¿Quién?">${campoImporte('importe')}
        <input class="campo" name="concepto" placeholder="Concepto (opcional)"><button class="boton">Apuntar</button>`, f => hacer('deuda', f));
    },
    descartar(el) {
      const d = D.deseos.find(x => x.id === el.dataset.id);
      if (!D.huchas.length) return hacer('decidirDeseo', { id: d.id });
      abrirModal('¿Y esos ' + eur(d.precio) + '?', `<div class="sub">Puedes meterlos en una hucha.</div>
        <div class="chips">${chip('hucha', '', 'No, solo descartar', true)}${D.huchas.map(h => chip('hucha', h.id, h.nombre)).join('')}</div>
        <button class="boton">Descartar</button>`, f => hacer('decidirDeseo', { id: d.id, hucha: f.hucha }));
    },
  };

  // ---------- Eventos ----------

  function ir(v) {
    vista = v;
    try { localStorage.setItem('gastos.vista', v); } catch (e) {}
    pintar();
    $('scroll').scrollTop = 0;
  }

  $('atras').onclick = () => ir('mas');
  $('antes').onclick = () => cargar(moverMes(mes, -1));
  $('despues').onclick = () => cargar(moverMes(mes, 1));

  document.addEventListener('click', async e => {
    const t = e.target.closest('[data-tab],[data-sub],[data-act],[data-copiar]');
    if (!t || !D) return;
    if (t.dataset.tab) return ir(t.dataset.tab);
    if (t.dataset.sub) return ir(t.dataset.sub);
    if (t.hasAttribute('data-copiar')) { t.select(); return; }
    const act = t.dataset.act;
    if (act === 'filtro') { filtroMovs = t.value; return pintar(); }
    if (act === 'anadirAmigo') return anadirAmigo(t.closest('form'));
    if (act === 'quitarFoto') {
      const form = t.closest('form');
      form._foto = null;
      return pintarFotoForm(form);
    }
    if (act === 'copiarAtajos') {
      try {
        await navigator.clipboard.writeText(t.dataset.texto);
        return avisar('Copiada. Ahora pégala en el atajo');
      } catch (err) {
        const i = t.parentElement.querySelector('[data-copiar]');
        i.select();
        return avisar('Mantén pulsado el texto seleccionado y pulsa Copiar');
      }
    }
    if (act === 'verDia') return avisar(`${t.dataset.dia} de ${nombreMes(mes)}: ${eur(Number(t.dataset.v))}`);
    // Borrar pide un segundo toque para confirmar.
    if (t.hasAttribute('data-peligro') && !t.classList.contains('seguro')) {
      t.classList.add('seguro');
      t.textContent = '¿Seguro?';
      setTimeout(() => { t.classList.remove('seguro'); t.textContent = '✕'; }, 3000);
      return;
    }
    if (MODALES[act]) return MODALES[act](t);
    const d = Object.assign({}, t.dataset);
    delete d.act;
    delete d.peligro;
    t.disabled = true;
    const enModal = !!t.closest('#modal');
    if (act === 'quitarTicket') delete FOTOS[d.id];
    if (act === 'comprar') await hacer('decidirDeseo', { id: d.id, comprar: true });
    else await hacer(act, d);
    if (enModal) cerrarModal();
  });

  document.addEventListener('submit', async e => {
    const form = e.target.closest('[data-form]');
    if (!form) return;
    e.preventDefault();
    const tipo = form.dataset.form;
    const boton = form.querySelector('button:not([type=button])');
    if (boton) boton.disabled = true;
    if (tipo === 'mov') await enviarMov(form);
    else await hacer(tipo, Object.fromEntries(new FormData(form)));
    if (boton) boton.disabled = false;
  });

  document.addEventListener('change', e => {
    const i = e.target.closest('[data-presu]');
    if (i) return hacer('tema', { tema: i.dataset.presu, tipo: 'gasto', presupuesto: i.value || '0' });
    const form = e.target.closest('form');
    if (!form) return;
    if (form.id === 'rapido') form.dataset.sucio = '1';
    if (e.target.matches('[data-foto], [data-mov]')) return elegirFoto(e.target);
    if (e.target.name === 'quien') {
      const b = form.querySelector('[data-reparto]');
      const conAmigos = e.target.value === 'amigos';
      if (b) b.hidden = !conAmigos;
      const g = form.querySelector('[data-guardar-reparto]');
      if (g) g.hidden = !conAmigos && !g.dataset.compartido;
    }
    if (e.target.matches('[data-amigo], [name=modo], [name=pago], [name=quien]')) actualizarReparto(form);
  });

  document.addEventListener('input', e => {
    const form = e.target.closest('form');
    if (!form) return;
    if (form.id === 'rapido') form.dataset.sucio = '1';
    if (e.target.matches('[name=importe], [data-parte]')) actualizarReparto(form);
  });

  // Intro en «Añadir amigo» añade al amigo, no envía el formulario.
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !e.target.matches('[data-nuevo-amigo]')) return;
    e.preventDefault();
    anadirAmigo(e.target.closest('form'));
  });

  if (!K) {
    pantallaClave();
    quitarSplash();
  } else {
    const cache = leerCache();
    if (cache && cache.mes) {
      D = cache;
      mes = D.mes;
      pintar();
      quitarSplash();
    }
    cargar(null);
  }
</script>
</body>
</html>
